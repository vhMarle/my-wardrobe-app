<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Wardrobe & Outfit Planner</title>
  
  <!-- Pink Flamingo Favicon -->
  <link rel="icon" href="https://fav.farm/%F0%9F%A6%9C" />

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .canvas-grid {
      background-size: 20px 20px;
      background-image: radial-gradient(circle, #e5e7eb 1px, transparent 1px);
    }
    .corner-handle {
      width: 12px;
      height: 12px;
      background-color: #4f46e5;
      border: 2px solid #ffffff;
      border-radius: 2px;
      position: absolute;
      z-index: 20;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-16 select-none">
  
  <header class="bg-white border-b sticky top-0 z-40 px-4 py-3 flex items-center justify-between shadow-sm">
    <h1 class="text-xl font-bold text-indigo-600 flex items-center gap-2">
      👔 My Wardrobe
    </h1>
    <nav class="flex gap-2">
      <button onclick="switchTab('wardrobe')" id="tab-wardrobe" class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-indigo-600 text-white">Closet</button>
      <button onclick="switchTab('outfit')" id="tab-outfit" class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-gray-100 text-gray-700">Outfit Canvas</button>
      <button onclick="switchTab('saved')" id="tab-saved" class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-gray-100 text-gray-700">Lookbook</button>
    </nav>
  </header>

  <main class="max-w-4xl mx-auto p-4">
    
    <section id="view-wardrobe" class="space-y-6">
      
      <div class="bg-white p-5 rounded-2xl border shadow-sm space-y-4">
        <h2 class="text-lg font-bold text-gray-900">Add New Item</h2>
        
        <div class="space-y-3">
          <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider">1. Choose Photo Source</label>
          <div class="flex gap-2">
            <button type="button" onclick="setImageSourceMode('file')" id="btn-src-file" class="flex-1 py-2 px-3 border rounded-xl text-xs font-semibold bg-indigo-50 border-indigo-600 text-indigo-600 flex items-center justify-center gap-1.5">
              📷 Camera / Gallery
            </button>
            <button type="button" onclick="setImageSourceMode('url')" id="btn-src-url" class="flex-1 py-2 px-3 border rounded-xl text-xs font-semibold bg-gray-50 border-gray-200 text-gray-600 flex items-center justify-center gap-1.5">
              🌐 Web Store Link / URL
            </button>
          </div>

          <!-- Mode A: File Upload / Camera -->
          <div id="container-src-file" class="block">
            <label class="w-full h-20 border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:border-indigo-500 bg-gray-50">
              <div class="text-center p-2">
                <span class="text-xl">📷</span>
                <p class="text-xs text-gray-500 font-medium">Tap to upload from photo gallery or take a picture</p>
              </div>
              <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
            </label>
          </div>

          <!-- Mode B: URL Input -->
          <div id="container-src-url" class="hidden space-y-2">
            <div class="flex gap-2">
              <input type="url" id="input-img-url" placeholder="Paste product link (e.g. https://www.hillhousehome.com/products/...)" class="flex-1 p-2.5 border rounded-xl text-sm">
              <button type="button" onclick="loadWebPageUrl()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-xs font-semibold shadow-sm">Load & Scan</button>
            </div>
          </div>

          <!-- INTERACTIVE DRAG & DIAGONAL CORNER SCALE EDITOR -->
          <div id="editor-container" class="hidden space-y-2 pt-2 border-t">
            <div class="flex justify-between items-center">
              <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Image Preview & Adjustments</label>
              <button type="button" onclick="resetImageTransform()" class="text-xs font-semibold text-indigo-600 hover:underline">⟲ Reset Align</button>
            </div>
            
            <p class="text-[11px] text-gray-400">💡 <strong>Click & drag image</strong> to move around. <strong>Drag any corner handle</strong> diagonally to zoom in or out.</p>

            <div class="flex justify-center">
              <!-- Square Workspace -->
              <div id="crop-viewport" class="w-72 h-72 border-2 border-indigo-200 rounded-2xl bg-gray-100 relative overflow-hidden flex items-center justify-center shadow-inner cursor-grab active:cursor-grabbing">
                
                <!-- Transformable Image -->
                <div id="transform-wrapper" class="absolute flex items-center justify-center w-full h-full pointer-events-none" style="transform: translate(0px, 0px) scale(1);">
                  <img id="image-preview" class="max-w-full max-h-full object-contain pointer-events-none select-none">
                  
                  <!-- 4 Corner Handles for Diagonal Resizing -->
                  <div id="handle-tl" class="corner-handle -top-1.5 -left-1.5 cursor-nwse-resize pointer-events-auto"></div>
                  <div id="handle-tr" class="corner-handle -top-1.5 -right-1.5 cursor-nesw-resize pointer-events-auto"></div>
                  <div id="handle-bl" class="corner-handle -bottom-1.5 -left-1.5 cursor-nesw-resize pointer-events-auto"></div>
                  <div id="handle-br" class="corner-handle -bottom-1.5 -right-1.5 cursor-nwse-resize pointer-events-auto"></div>
                </div>

              </div>
            </div>
          </div>
        </div>

        <div class="space-y-3 pt-2">
          <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider">2. Item Details</label>
          <div class="grid grid-cols-2 gap-3">
            
            <div class="col-span-2 sm:col-span-1">
              <label class="text-xs font-semibold text-gray-500">Category</label>
              <select id="input-category" class="w-full p-2 border rounded-lg text-sm bg-white" onchange="handleCategoryChange()"></select>
            </div>

            <div id="custom-category-container" class="col-span-2 sm:col-span-1 hidden">
              <label class="text-xs font-semibold text-indigo-600">New Category Name</label>
              <input type="text" id="input-custom-category" placeholder="e.g. Scarves, Hats" class="w-full p-2 border border-indigo-300 rounded-lg text-sm bg-indigo-50">
            </div>

            <div>
              <label class="text-xs font-semibold text-gray-500">Brand</label>
              <input type="text" id="input-brand" placeholder="e.g. Hill House" class="w-full p-2 border rounded-lg text-sm">
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-500">Color</label>
              <input type="text" id="input-color" placeholder="e.g. Emerald Trellis" class="w-full p-2 border rounded-lg text-sm">
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-500">Size</label>
              <input type="text" id="input-size" placeholder="e.g. Medium / 10" class="w-full p-2 border rounded-lg text-sm">
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-500">Where Bought</label>
              <input type="text" id="input-bought" placeholder="e.g. Hill House Home" class="w-full p-2 border rounded-lg text-sm">
            </div>
          </div>
        </div>

        <div class="flex items-center justify-between pt-3 border-t">
          <span id="ai-status" class="text-xs font-medium text-indigo-600"></span>
          <button onclick="saveItem()" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-indigo-700 shadow-sm">Save to Closet</button>
        </div>
      </div>

      <div class="bg-white p-4 rounded-2xl border shadow-sm space-y-3">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
          <h2 class="text-lg font-bold text-gray-900">Your Closet Items</h2>
          
          <div class="flex items-center gap-1 bg-gray-100 p-1 rounded-xl text-xs font-semibold">
            <button onclick="setViewMode('grid-3')" id="btn-view-grid-3" class="px-2.5 py-1.5 rounded-lg bg-white shadow-xs text-indigo-600">Grid (3-4)</button>
            <button onclick="setViewMode('grid-2')" id="btn-view-grid-2" class="px-2.5 py-1.5 rounded-lg text-gray-600">Grid (2)</button>
            <button onclick="setViewMode('single')" id="btn-view-single" class="px-2.5 py-1.5 rounded-lg text-gray-600">1 at a Time</button>
          </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-2 border-t text-xs">
          <div>
            <label class="font-semibold text-gray-500 mb-1 block">Filter Category</label>
            <select id="filter-category" onchange="renderWardrobe()" class="w-full p-1.5 border rounded-lg bg-gray-50">
              <option value="ALL">All Categories</option>
            </select>
          </div>
          <div>
            <label class="font-semibold text-gray-500 mb-1 block">Filter Color</label>
            <select id="filter-color" onchange="renderWardrobe()" class="w-full p-1.5 border rounded-lg bg-gray-50">
              <option value="ALL">All Colors</option>
            </select>
          </div>
          <div>
            <label class="font-semibold text-gray-500 mb-1 block">Filter Brand</label>
            <select id="filter-brand" onchange="renderWardrobe()" class="w-full p-1.5 border rounded-lg bg-gray-50">
              <option value="ALL">All Brands</option>
            </select>
          </div>
          <div class="flex items-end">
            <button onclick="openManageCategoriesModal()" class="w-full py-1.5 px-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-lg border text-center">
              ⚙️ Rename Categories
            </button>
          </div>
        </div>
      </div>

      <div id="items-display-container"></div>
    </section>

    <section id="view-outfit" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-gray-900">Interactive Canvas</h2>
        <button onclick="saveOutfit()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-emerald-700">Save Outfit Idea</button>
      </div>

      <div id="canvas" class="w-full h-96 bg-white border-2 border-dashed border-gray-300 rounded-2xl canvas-grid relative overflow-hidden flex items-center justify-center">
        <p id="canvas-empty-msg" class="text-sm text-gray-400">Tap items below to add them to your look
